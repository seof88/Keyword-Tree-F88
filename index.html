<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cây từ khóa F88</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: một cột 880px, ô tìm kiếm + nút trên cùng, hàng chip chủ đề, rồi các thẻ cụm chủ đề có đường cây bên trái */
:root{
  --bg:#f5f3ee; --card:#fffefb; --card-head:#f8f4ea; --fg:#22241f; --muted:#7a7a70; --line:#e4e0d4;
  --accent:#2f4a2c; --accent-fg:#ffffff; --pill:#e0e8d9; --pill-fg:#2f4a2c; --warn:#f3e6c4; --warn-fg:#6b4f0e; --idle:#e9e6dd; --idle-fg:#55554d; --danger:#a33a2a;
  --display:'Fraunces',Georgia,'Times New Roman',serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171a15; --card:#1f231c; --card-head:#242920; --fg:#ebeae2; --muted:#9a9b8f; --line:#333829;
  --accent:#a9c99c; --accent-fg:#16200f; --pill:#2f3d29; --pill-fg:#bcd9af; --warn:#463c1e; --warn-fg:#e8d59a; --idle:#2b2f25; --idle-fg:#b3b3a6; --danger:#e08a78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a15; --card:#1f231c; --card-head:#242920; --fg:#ebeae2; --muted:#9a9b8f; --line:#333829;
  --accent:#a9c99c; --accent-fg:#16200f; --pill:#2f3d29; --pill-fg:#bcd9af; --warn:#463c1e; --warn-fg:#e8d59a; --idle:#2b2f25; --idle-fg:#b3b3a6; --danger:#e08a78; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:44px 80px}
.wrap{max-width:880px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:34px;line-height:1.1;margin:0 0 8px;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.saved{color:var(--muted);font-size:12.5px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:10px;margin:26px 0 22px;flex-wrap:wrap}
.search{flex:1 1 260px;min-width:0;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:7px;background:var(--card);padding:0 12px 0 38px}
.btn{height:38px;padding:0 16px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding:22px 0;border-top:1px solid var(--line);margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:600;font-size:13px}
.chip span{color:var(--muted);font-weight:400}
.chip:hover,.chip.on{border-color:var(--accent)}
.cluster{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:18px 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);scroll-margin-top:16px}
.chead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(var(--card),var(--card-head));border-bottom:1px solid var(--line)}
.chead.closed{border-bottom-color:transparent}
.tog{border:0;background:none;padding:2px 4px;font-size:9px;color:var(--fg);transition:transform .15s}
.closed .tog{transform:rotate(-90deg)}
.cname{flex:1;min-width:0;border:0;background:none;font-family:var(--display);font-size:19px;font-weight:600;padding:2px 0}
.cname:focus{background:var(--bg);outline:1px solid var(--line)}
.count{color:var(--muted);font-size:12.5px;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px;border-radius:5px}
.x:hover{color:var(--danger)}
.x.ask{color:var(--danger);font-size:12px;font-weight:600}
.rows{padding:8px 18px 10px 30px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 116px 24px;gap:14px;align-items:center;padding:8px 0;position:relative}
.row::before{content:"";position:absolute;left:-17px;top:0;bottom:0;border-left:1px solid var(--line)}
.row::after{content:"";position:absolute;left:-17px;top:50%;width:11px;height:10px;border-bottom:1px solid var(--line);border-bottom-left-radius:6px;transform:translateY(-100%)}
.row:last-of-type::before{bottom:50%}
.row input{width:100%;min-width:0;border:1px solid transparent;background:none;border-radius:5px;padding:5px 6px;text-overflow:ellipsis}
.row input:hover{border-color:var(--line)}
.row input:focus{background:var(--bg);border-color:var(--line);outline:none}
.row .u{color:var(--muted);font-size:13px}
.pill{border:0;border-radius:999px;height:29px;font-weight:600;font-size:12.5px;background:var(--pill);color:var(--pill-fg)}
.pill.s1{background:var(--warn);color:var(--warn-fg)}
.pill.s2{background:var(--idle);color:var(--idle-fg)}
.add{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0 6px 2px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
@media (max-width:640px){
  h1{font-size:28px}
  .row{grid-template-columns:minmax(0,1fr) 100px 24px;row-gap:0}
  .row .u{grid-column:1 / 2;grid-row:2;padding-top:0}
  .row .pill{grid-column:2;grid-row:1 / 3}
  .row .x{grid-column:3;grid-row:1 / 3}
  .rows{padding-left:26px;padding-right:12px}
}
</style>
</head>

var state=load()||DATA.map(function(c){return {n:c.n,kw:c.kw,open:true,ask:false}});
var STAT=["Đã đăng","Đang viết","Chưa đăng"];
var query="";
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById("saved").textContent="Đã lưu trong trình duyệt này"}catch(e){document.getElementById("saved").textContent="Chưa lưu được trong trình duyệt này"}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d")}
function render(){
  var nq=norm(query.trim()),html="",chips="",shown=0;
  state.forEach(function(c,ci){
    chips+='<button class="chip" data-go="'+ci+'">'+esc(c.n)+' <span>· '+c.kw.length+'</span></button>';
    var rows="",hit=0;
    c.kw.forEach(function(k,ki){
      if(nq&&norm(k.k+" "+k.u).indexOf(nq)<0)return;
      hit++;
      var si=Math.max(0,STAT.indexOf(k.s));
      rows+='<div class="row"><input data-f="k" data-c="'+ci+'" data-k="'+ki+'" value="'+esc(k.k)+'" aria-label="Từ khóa">'+
        '<input class="u" data-f="u" data-c="'+ci+'" data-k="'+ki+'" value="'+esc(k.u)+'" aria-label="Liên kết bài viết">'+
        '<button class="pill s'+si+'" data-st="'+ci+','+ki+'" title="Bấm để đổi trạng thái">'+STAT[si]+'</button>'+
        '<button class="x" data-dk="'+ci+','+ki+'" aria-label="Xóa từ khóa">×</button></div>';
    });
    if(nq&&!hit&&norm(c.n).indexOf(nq)<0)return;
    shown++;
    var open=c.open||nq;
    html+='<section class="cluster" id="c'+ci+'"><div class="chead'+(open?'':' closed')+'"><button class="tog" data-t="'+ci+'" aria-label="Thu gọn hoặc mở rộng">▼</button>'+
      '<input class="cname" data-f="n" data-c="'+ci+'" value="'+esc(c.n)+'" aria-label="Tên cụm chủ đề"><span class="count">'+(nq?hit+'/':'')+c.kw.length+' từ khóa</span>'+
      '<button class="x'+(c.ask?' ask':'')+'" data-dc="'+ci+'" aria-label="Xóa cụm">'+(c.ask?'Xóa cụm?':'×')+'</button></div>'+
      (open?'<div class="rows">'+rows+'<button class="add" data-ak="'+ci+'">+ Thêm từ khóa</button></div>':'')+'</section>';
  });
  document.getElementById("chips").innerHTML=chips;
  document.getElementById("tree").innerHTML=html||'<div class="empty">Không có từ khóa nào khớp với "'+esc(query)+'".</div>';
}
document.getElementById("q").addEventListener("input",function(e){query=e.target.value;render()});
document.addEventListener("change",function(e){
  var t=e.target,f=t.dataset.f;if(!f)return;
  var c=state[+t.dataset.c];
  if(f==="n")c.n=t.value;else c.kw[+t.dataset.k][f]=t.value;
  save();if(f==="n")render();
});
document.addEventListener("click",function(e){

  if(d.go!==undefined){state[+d.go].open=true;render();var el=document.getElementById("c"+d.go);if(el)el.scrollIntoView({behavior:"smooth"});return}
  if(d.t!==undefined){state[+d.t].open=!state[+d.t].open}
  else if(d.st){var p=d.st.split(",").map(Number),k=state[p[0]].kw[p[1]];k.s=STAT[(STAT.indexOf(k.s)+1)%3]}
  else if(d.dk){var q=d.dk.split(",").map(Number);state[q[0]].kw.splice(q[1],1)}
  else if(d.dc!==undefined){var c=state[+d.dc];if(c.ask){state.splice(+d.dc,1)}else{state.forEach(function(x){x.ask=false});c.ask=true}}
  else if(d.ak!==undefined){state[+d.ak].kw.push({k:"Từ khóa mới",u:"https://f88.vn/",s:"Chưa đăng"})}
  else if(t.id==="addc"){state.unshift({n:"Cụm chủ đề mới",kw:[],open:true,ask:false});query="";document.getElementById("q").value=""}
  else if(t.id==="csv")return exp("CSV");
  else if(t.id==="json")return exp("JSON");
  else if(t.id==="expx"){document.getElementById("exp").hidden=true;return}
  else if(t.id==="expc"){var a=document.getElementById("expa");a.select();try{navigator.clipboard.writeText(a.value).then(function(){t.textContent="Đã sao chép"},function(){document.execCommand("copy")})}catch(x){document.execCommand("copy")}return}
  else return;
  save();render();
});
function exp(kind){
  var text;
  if(kind==="JSON")text=JSON.stringify(state.map(function(c){return {cum_chu_de:c.n,tu_khoa:c.kw.map(function(k){return {tu_khoa:k.k,url:k.u,trang_thai:k.s}})}}),null,2);
  else{var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"'};text="﻿Cụm chủ đề,Từ khóa,URL,Trạng thái\n"+state.reduce(function(a,c){return a.concat(c.kw.map(function(k){return [q(c.n),q(k.k),q(k.u),q(k.s)].join(",")}))},[]).join("\n")}
  document.getElementById("expt").textContent="Xuất "+kind+" — chọn và sao chép nội dung bên dưới";
  document.getElementById("expa").value=text;document.getElementById("expc").textContent="Sao chép";
  var b=document.getElementById("exp");b.hidden=false;b.scrollIntoView({behavior:"smooth"});
}
render();
</script>
